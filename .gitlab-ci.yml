include:
  - project: devsecops/fpf-deploy-template
    ref: v1
    file: pipeline.yml

variables:
  KUBE_NAMESPACE: chronos
  FPF_ENV: staging

test:backend:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-$CI_JOB_NAME
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt
    - pytest -q
